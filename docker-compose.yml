# 로컬 실행 — 서버 + PostgreSQL. 실제 디스코드·슬랙 연결은 .env 에 토큰을 넣고 enabled=true 로
services:
  db:
    image: postgres:16-alpine
    # 맥을 다시 켜거나 OrbStack 이 다시 뜨면 저절로 다시 켠다(직접 끈 경우는 제외)
    restart: unless-stopped
    environment:
      POSTGRES_DB: gameops
      POSTGRES_USER: gameops
      POSTGRES_PASSWORD: ${DB_PASSWORD:-gameops}
    # DB 포트는 밖으로 열지 않는다(내 PC에 PostgreSQL이 이미 있어도 충돌하지 않게). 직접 붙어 보려면
    # 아래 두 줄의 주석을 풀고 왼쪽 숫자를 비어 있는 포트로 바꾼다.
    # ports:
    #   - "55432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gameops -d gameops"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_URL: jdbc:postgresql://db:5432/gameops
      DB_USER: gameops
      DB_PASSWORD: ${DB_PASSWORD:-gameops}
      # 분류 키워드는 config/classifier-rules.json 에서 읽는다. 파일을 고치고 저장하면 다음 제보부터 반영된다.
      CLASSIFIER_RULES_FILE: /app/config/classifier-rules.json
      # 게임 목록(게임별 디스코드 제보 채널·슬랙 알림 채널). 고친 뒤 서버를 다시 켜면 반영된다.
      GAMES_FILE: /app/config/games.json
      # 슬랙 버튼 주소가 바뀌면 슬랙 긴급 채널에 알린다(터널을 안 켰으면 조용히 쉰다)
      TUNNEL_METRICS_URL: http://tunnel:2000/quicktunnel
      # 지금 버전. 자동 업데이트·start.sh 가 넣는다(결정 46)
      GAMEOPS_VERSION: ${GAMEOPS_VERSION:-}
    volumes:
      # 파일 하나가 아니라 폴더를 연결한다(편집기가 저장할 때 파일을 새로 만들어도 반영되게)
      - ./config:/app/config:ro
    # 내 컴퓨터 안에서만 열린다(같은 와이파이의 다른 기기도 못 들어온다). 바깥은 슬랙 버튼 주소 하나뿐.
    ports:
      - "127.0.0.1:8080:8080"

  # 자동 업데이트(결정 46): 깃허브 main 에 새 커밋이 오면 이 폴더를 맞추고 서버를 새로 만들어 켠다. 안 켜지면 되돌린다.
  # 끄기: .env 에 AUTO_UPDATE=false. 같은 경로로 폴더를 연결해야 서버를 다시 만들 때 경로가 맞는다.
  updater:
    image: docker:27-cli
    restart: unless-stopped
    depends_on:
      - app
    working_dir: ${PWD}
    environment:
      UPDATE_INTERVAL: ${UPDATE_INTERVAL:-600}
    volumes:
      - type: bind
        source: .
        target: ${PWD}
      - /var/run/docker.sock:/var/run/docker.sock
    entrypoint: ["sh", "deploy/updater.sh"]

  # 개발 AI 러너(결정 49): 슬랙에서 승인한 수정을 Codex 로 고쳐 브랜치를 올린다. .env 에 DEV_RUNNER_ENABLED=true 일 때만 일이 온다.
  # Codex 로그인은 맥의 ~/.codex(codex login 한 번)를 쓴다. 깃허브 토큰에 게임 저장소 Contents·Pull requests 쓰기 권한이 필요하다
  dev-runner:
    build:
      context: .
      dockerfile: deploy/dev-runner.Dockerfile
    restart: unless-stopped
    depends_on:
      - app
    environment:
      OPS_API: http://app:8080
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      CODEX_HOME: /codex
      HOST_CODEX: /host-codex
    volumes:
      # 맥 Codex 폴더. 러너는 여기서 로그인 파일만 복사해 쓴다
      - ${HOME}/.codex:/host-codex

  # 슬랙 버튼용 공개 주소. SLACK_SIGNING_SECRET 이 있을 때 start.sh 가 함께 켠다(직접 켤 때: docker compose --profile slack-buttons up -d).
  # gateway 는 /slack/interactions 하나만 서버로 넘기고, tunnel 은 그 문만 인터넷에 연결한다.
  slack-gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    profiles: ["slack-buttons"]
    depends_on:
      - app
    volumes:
      - ./deploy/slack-gateway.conf:/etc/nginx/conf.d/default.conf:ro

  tunnel:
    image: cloudflare/cloudflared:2025.1.0
    # 저절로 다시 켜지면 임시 주소가 바뀐다 → 서버가 1분 안에 슬랙 긴급 채널로 새 주소를 알린다(TunnelUrlWatcher)
    restart: unless-stopped
    profiles: ["slack-buttons"]
    depends_on:
      - slack-gateway
    # 계정 없이 쓰는 임시 주소(https://<무작위>.trycloudflare.com). 껐다 켜면 주소가 바뀐다.
    # --metrics: 서버가 지금 주소를 물어보는 창구(/quicktunnel). 밖으로 열지 않는다(ports 없음)
    command: tunnel --no-autoupdate --metrics 0.0.0.0:2000 --url http://slack-gateway:8081

volumes:
  db-data:
