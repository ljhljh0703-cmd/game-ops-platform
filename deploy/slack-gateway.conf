# 바깥(인터넷)에 여는 문은 슬랙 주소 셋뿐이다(버튼·입력 창 /slack/interactions, 홈 탭 이벤트 /slack/events, 슬랙 명령 /slack/commands). 셋 다 서버가 서명을 확인한다. 나머지 주소(이슈 조회·제보 등록·관리 API)는 내 컴퓨터 안에서만 쓴다.
server {
    listen 8081;
    server_tokens off;
    client_max_body_size 64k;

    # 서버 컨테이너가 다시 만들어져 내부 주소가 바뀌어도 10초 안에 따라간다(Docker 내부 이름 서버)
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $app_upstream http://app:8080;

    location = /slack/interactions {
        limit_except POST { deny all; }
        proxy_pass $app_upstream;
        proxy_set_header Host $host;
        proxy_read_timeout 10s;
    }

    location = /slack/events {
        limit_except POST { deny all; }
        proxy_pass $app_upstream;
        proxy_set_header Host $host;
        proxy_read_timeout 10s;
    }

    location = /slack/commands {
        limit_except POST { deny all; }
        proxy_pass $app_upstream;
        proxy_set_header Host $host;
        proxy_read_timeout 10s;
    }

    location / {
        return 404;
    }
}
