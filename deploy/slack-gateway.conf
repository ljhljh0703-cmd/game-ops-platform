# 게임 오류 받는 곳은 주소당 1분 30번까지(결정 37)
limit_req_zone $binary_remote_addr zone=gameerr:1m rate=30r/m;

# 바깥(인터넷)에 여는 문은 슬랙 주소 셋과 게임 오류 받는 곳뿐이다(버튼·입력 창 /slack/interactions, 홈 탭 이벤트 /slack/events, 슬랙 명령 /slack/commands). 셋 다 서버가 서명을 확인한다. 나머지 주소(이슈 조회·제보 등록·관리 API)는 내 컴퓨터 안에서만 쓴다.
server {
    listen 8081;
    server_tokens off;
    client_max_body_size 64k;

    # 서버 컨테이너가 다시 만들어져 내부 주소가 바뀌어도 10초 안에 따라간다(Docker 내부 이름 서버)
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $app_upstream http://app:8080;

    location = /slack/interactions {
        limit_except POST { deny all; }
        proxy_pass $app_upstream;
        proxy_set_header Host $host;
        proxy_read_timeout 10s;
    }

    location = /slack/events {
        limit_except POST { deny all; }
        proxy_pass $app_upstream;
        proxy_set_header Host $host;
        proxy_read_timeout 10s;
    }

    location = /slack/commands {
        limit_except POST { deny all; }
        proxy_pass $app_upstream;
        proxy_set_header Host $host;
        proxy_read_timeout 10s;
    }

    # 게임 오류 보내기 — 서버가 크기(16KB)·게임 키·하루 새 오류 200종을 막는다
    location ~ "^/api/games/[a-z0-9-]{1,40}/errors$" {
        limit_except POST OPTIONS { deny all; }
        limit_req zone=gameerr burst=10 nodelay;
        client_max_body_size 16k;
        proxy_pass $app_upstream;
        proxy_set_header Host $host;
        proxy_read_timeout 5s;
    }

    location / {
        return 404;
    }
}
