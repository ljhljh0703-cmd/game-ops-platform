// 게임 운영 플랫폼 빌드 설정 — Spring Boot 3 · PostgreSQL · 디스코드(JDA) · 슬랙
plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.5'
    id 'io.spring.dependency-management' version '1.1.6'
}

group = 'com.ljh.gameops'
version = '0.1.0'

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
}

repositories { mavenCentral() }

ext['testcontainers.version'] = '1.21.3'

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    // API 명세(OpenAPI) 자동 생성 — /v3/api-docs, 화면은 /swagger-ui.html
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.6.0'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'

    implementation('net.dv8tion:JDA:5.6.1') { exclude module: 'opus-java' }
    implementation 'com.slack.api:slack-api-client:1.45.3'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    systemProperty 'updateOpenApi', System.getProperty('updateOpenApi', 'false')
    testLogging { events 'passed', 'skipped', 'failed'; exceptionFormat 'full' }
}

// 분류·묶기 평가 하네스 — ./gradlew evalClassifier [-Prules=파일] [-Pllm=true] [-Plabel=이름]
// 결과: eval/results/<날짜>-<이름>.md (평가 묶음: eval/*.jsonl)
tasks.register('evalClassifier', JavaExec) {
    group = 'verification'
    description = '분류 정확도와 묶기 기준값을 평가 묶음으로 잰다'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.ljh.gameops.eval.EvalMain'
    workingDir = projectDir
    jvmArgs '-Dfile.encoding=UTF-8', '-Dstdout.encoding=UTF-8'
    systemProperty 'eval.rules', project.findProperty('rules') ?: ''
    systemProperty 'eval.llm', project.findProperty('llm') ?: 'false'
    if (project.hasProperty('label')) systemProperty 'eval.label', project.property('label')
}
