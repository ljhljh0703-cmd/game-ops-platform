# 게임 운영 플랫폼 설정 — 값은 환경 변수로 덮어쓴다(.env.example 참고)
spring:
  application:
    name: game-ops-platform
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/gameops}
    username: ${DB_USER:gameops}
    password: ${DB_PASSWORD:gameops}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

gameops:
  author-hash-salt: ${AUTHOR_HASH_SALT:change-me-local-only}
  issue:
    # 분류가 같은 이슈끼리만 비교하므로 기준이 낮다(P9). 되돌리려면 DUPLICATE_SAME_CATEGORY_ONLY=false, DUPLICATE_THRESHOLD=0.55
    duplicate-threshold: ${DUPLICATE_THRESHOLD:0.20}
    same-category-only: ${DUPLICATE_SAME_CATEGORY_ONLY:true}
    recurrence-window-days: ${RECURRENCE_WINDOW_DAYS:30}
  # 묶기 둘째 단계(결정 41): 글자 비교로 못 묶은 제보를 AI 에게 묻는다. AI 키(LLM_API_KEY)가 있을 때만. 한 제보에 최대 3번
  # 외국어 제보 한국어 번역(결정 42). AI 키가 있을 때만. 플레이어 답장은 키가 없어도 그 사람 말로
  translate:
    enabled: ${TRANSLATE_ENABLED:true}
  dedupe:
    ai-judge: ${DEDUPE_AI_JUDGE:true}
    ai-min-confidence: ${DEDUPE_AI_MIN_CONFIDENCE:0.5}
    ai-candidates: ${DEDUPE_AI_CANDIDATES:3}
  outbox:
    batch-size: 20
    max-attempts: 5
    base-backoff-ms: 2000
    poll-ms: ${OUTBOX_POLL_MS:5000}
  classifier:
    rules-file: ${CLASSIFIER_RULES_FILE:}
    llm:
      enabled: ${LLM_ENABLED:false}
      base-url: ${LLM_BASE_URL:https://api.openai.com/v1}
      api-key: ${LLM_API_KEY:}
      model: ${LLM_MODEL:gpt-4o-mini}
      timeout-seconds: 10
  games:
    # 운영하는 게임 목록(게임별 디스코드 제보 채널·슬랙 알림 채널). 비우면 서버에 같이 넣은 기본 목록.
    file: ${GAMES_FILE:}
  admin:
    api-keys:
      local-admin: ${ADMIN_API_KEY:}
      # AI 에이전트(MCP) 전용 키. 사람 키와 따로 두어 감사 기록에 ai-agent 로 남고, 언제든 이 키만 끊을 수 있다
      ai-agent: ${AGENT_API_KEY:}
    slack-user-ids: ${SLACK_ADMIN_USER_IDS:}
  slack:
    enabled: ${SLACK_ENABLED:false}
    bot-token: ${SLACK_BOT_TOKEN:}
    signing-secret: ${SLACK_SIGNING_SECRET:}
    # 소켓 모드(결정 40) — 앱 토큰(xapp-…, connections:write)이 있으면 공개 주소 없이 버튼·명령·이벤트를 받는다. 비우면 주소(HTTP) 방식
    app-token: ${SLACK_APP_TOKEN:}
    channels:
      default-channel: ${SLACK_CHANNEL_DEFAULT:}
      urgent: ${SLACK_CHANNEL_URGENT:}
    # 카드마다 봇 얼굴(게임별 이름·아이콘은 games.json). 슬랙 앱에 chat:write.customize 를 더하고 다시 설치한 뒤 true
    identity:
      enabled: ${SLACK_CUSTOM_IDENTITY:false}
      name: ${SLACK_BOT_NAME:게임 운영 봇}
      icon: ${SLACK_BOT_ICON:https://raw.githubusercontent.com/ljhljh0703-cmd/game-ops-platform/main/docs/brand/opsbot.png}
    # 슬랙 버튼 주소 지킴이(TunnelUrlWatcher) — 터널의 주소 창구. 비우면 끈다. docker-compose 가 채운다
    tunnel-metrics-url: ${TUNNEL_METRICS_URL:}
    tunnel-check-ms: 60000
  discord:
    enabled: ${DISCORD_ENABLED:false}
    bot-token: ${DISCORD_BOT_TOKEN:}
    report-channel-ids: ${DISCORD_REPORT_CHANNEL_IDS:}
    default-game: ${DISCORD_DEFAULT_GAME:gemtower}
    # 끊어 쓴 글 합치기(결정 44): 같은 사람이 이어 쓴 줄은 마지막 글 뒤 20초 조용하면(처음 글부터 최대 60초) 제보 하나로
    merge-quiet-ms: ${DISCORD_MERGE_QUIET_MS:20000}
    merge-max-ms: ${DISCORD_MERGE_MAX_MS:60000}
  github:
    # 「개발 AI에게 넘기기」 — 게임 저장소에 개발 지시서 이슈를 만든다. 저장소 Issues 쓰기 권한 토큰. 비우면 넘기기만 꺼진다
    token: ${GITHUB_TOKEN:}
    api-url: ${GITHUB_API_URL:https://api.github.com}
    # 고친 코드가 들어왔는지 보는 간격(합쳐진 PR·기본 브랜치 커밋의 ops-번호 → 자동 해결)
    watch-ms: ${GITHUB_WATCH_MS:20000}
  ai:
    # 서버가 부르는 AI(분류·보고서) 비용 계산 단가 — 백만 토큰당 달러(Anthropic 가격표 claude-haiku-5-5, 2026-10 확인). 모델을 바꾸면 같이 바꾼다
    price-input-per-mtok: ${AI_PRICE_INPUT:0.10}
    price-output-per-mtok: ${AI_PRICE_OUTPUT:0.50}
    price-input-long-per-mtok: ${AI_PRICE_INPUT_LONG:0.50}
    price-output-long-per-mtok: ${AI_PRICE_OUTPUT_LONG:2.50}
    long-prompt-tokens: 100000
    # 한 달 예산(달러). 넘으면 이번 달은 AI 를 안 부르고 규칙·기록만으로. 0 이면 제한 없음
    monthly-budget-usd: ${AI_MONTHLY_BUDGET_USD:5}
    # 남은 크레딧 추정(결정 38) — 콘솔 Billing 에서 본 잔액(달러)과 본 날(2026-10-21 또는 2026-10-21T10:50). 비우면 안 보인다
    credit-balance-usd: ${AI_CREDIT_BALANCE_USD:}
    credit-balance-at: ${AI_CREDIT_BALANCE_AT:}
    # 있으면 그 뒤 쓴 돈을 Anthropic 공식 비용 보고(계정 전체)에서 읽는다. 조직 관리 키(sk-ant-admin…). 비우면 이 서버 기록으로
    admin-key: ${ANTHROPIC_ADMIN_KEY:}
    # 한 시간 AI 호출 상한(결정 43). 넘으면 그 시간은 규칙만. 평소 제보 수의 몇 배로
    max-calls-per-hour: ${AI_MAX_CALLS_PER_HOUR:600}
  intake:
    # 도배 막기 — 한 사람이 10분에 이만큼 넘게 디스코드 제보를 올리면 받지 않는다. 0 이면 끔
    max-per-10min: ${INTAKE_MAX_PER_10MIN:5}
    # 신뢰 등급(결정 44, docs/SECURITY.md) — 계정 나이가 아니라 한 일로. 새 사람 3건 · 확인된 사람 위의 5건 · 믿는 사람·우수 테스터 10건 · 운영진 제한 없음
    limit-new: ${INTAKE_LIMIT_NEW:3}
    limit-trusted: ${INTAKE_LIMIT_TRUSTED:10}
    trusted-issues: ${INTAKE_TRUSTED_ISSUES:3}
    trusted-days: ${INTAKE_TRUSTED_DAYS:2}
    # 디스코드 역할 이름이나 ID(쉼표로). 우수 테스터 = 10분 10건·몰려도 바로 접수, 운영진 = 한도 없음
    member-roles: ${DISCORD_MEMBER_ROLES:우수 테스터}
    staff-roles: ${DISCORD_STAFF_ROLES:}
    # 게임 하나에 1분에 이만큼 넘게 몰리면 새 사람 제보는 보류함에(잃지 않음), 풀리면 차례로 접수
    flood-per-min: ${INTAKE_FLOOD_PER_MIN:30}
  jira:
    # Jira 버그 티켓(결정 32) — Jira Cloud 주소(https://회사.atlassian.net)·계정 메일·API 토큰. 셋 중 하나라도 비면 Jira 버튼이 안 보인다
    base-url: ${JIRA_BASE_URL:}
    email: ${JIRA_EMAIL:}
    api-token: ${JIRA_API_TOKEN:}
    # 만든 티켓이 완료로 옮겨졌는지 보는 간격
    watch-ms: ${JIRA_WATCH_MS:60000}
  weekly-report:
    cron: "0 0 9 * * MON"
    zone: Asia/Seoul
